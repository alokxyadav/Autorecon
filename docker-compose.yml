version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autorecon
      POSTGRES_USER: autorecon
      POSTGRES_PASSWORD: autorecon
    ports:
      - "5432:5432"
    volumes:
      - autorecon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorecon"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://autorecon:autorecon@db:5432/autorecon
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTORECON_API_KEY: ${AUTORECON_API_KEY:-}
      AUTO_APPROVE_CONFIDENCE_THRESHOLD: ${AUTO_APPROVE_CONFIDENCE_THRESHOLD:-90}
      AUTO_APPROVE_MAX_AMOUNT: ${AUTO_APPROVE_MAX_AMOUNT:-500.00}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Uses Python's stdlib urllib rather than curl/wget, since the base
      # image (python:3.11-slim) doesn't include either by default and
      # adding one just for a healthcheck would be unnecessary image bloat.
      # Hits /health/ready specifically (not /health) so Compose won't
      # report "healthy" until the database connection actually works —
      # the exact ordering gap that used to let the frontend start against
      # a backend that was up but not yet able to serve real requests.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${AUTORECON_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autorecon_db_data:
